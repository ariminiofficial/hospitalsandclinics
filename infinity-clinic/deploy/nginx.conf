# Website — https://clinic.arimini.in
server {
    listen 80;
    server_name clinic.arimini.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clinic.arimini.in;

    # ssl_certificate /etc/letsencrypt/live/clinic.arimini.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/clinic.arimini.in/privkey.pem;

    root /var/www/infinity-clinic/web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# API — https://clinicapi.arimini.in
server {
    listen 80;
    server_name clinicapi.arimini.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clinicapi.arimini.in;

    # ssl_certificate /etc/letsencrypt/live/clinicapi.arimini.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/clinicapi.arimini.in/privkey.pem;

    location /api {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
