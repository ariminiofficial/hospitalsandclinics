<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            font-variation-settings: 'FILL' 1;

<body class="bg-background min-h-screen text-on-background font-body-md text-body-md antialiased overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Top Action Bar -->
<header class="sticky top-0 z-40 bg-surface flex items-center px-md h-16 border-b border-outline-variant">
<button aria-label="Go back" class="p-2 -ml-2 text-on-surface hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="ml-4 font-headline-sm text-headline-sm text-on-surface">Choose Time Slot</h1>
</header>
<!-- Main Content -->
<main class="pb-[140px]"> <!-- Padding for fixed footer and bottom nav -->
<!-- Date Selector Subheader -->
<section class="bg-surface px-md py-lg border-b border-outline-variant">
<div class="flex items-center justify-between">
<button class="p-2 text-secondary hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_left</span>
</button>
<div class="flex flex-col items-center">
<span class="font-label-md text-label-md text-secondary uppercase">Selected Date</span>
<h2 class="font-headline-md text-headline-md text-primary mt-1">Wed, Oct 25</h2>
</div>
<button class="p-2 text-secondary hover:bg-surface-container rounded-full transition-colors">
<span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</section>
<!-- Time Slots Grid Canvas -->
<section class="px-md py-lg space-y-lg">
<!-- Morning Section -->
<div>
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-secondary text-[18px]">light_mode</span>
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest">Morning</h3>
</div>
<div class="grid grid-cols-3 gap-3">
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        09:00
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        09:30
                    </button>
<button class="bg-surface-container text-secondary opacity-50 cursor-not-allowed rounded-lg py-3 flex justify-center items-center font-body-md text-body-md line-through" disabled="">
                        10:00
                    </button>
<button class="bg-primary text-on-primary rounded-lg py-3 flex justify-center items-center font-headline-sm text-[16px] shadow-sm transform scale-[0.98] transition-transform">
                        10:30
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        11:00
                    </button>
<button class="bg-surface-container text-secondary opacity-50 cursor-not-allowed rounded-lg py-3 flex justify-center items-center font-body-md text-body-md line-through" disabled="">
                        11:30
                    </button>
</div>
</div>
<!-- Afternoon Section -->
<div>
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-secondary text-[18px]">partly_cloudy_day</span>
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest">Afternoon</h3>
</div>
<div class="grid grid-cols-3 gap-3">
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        12:00
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        12:30
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        01:00
                    </button>
<button class="bg-surface-container text-secondary opacity-50 cursor-not-allowed rounded-lg py-3 flex justify-center items-center font-body-md text-body-md line-through" disabled="">
                        01:30
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        02:00
                    </button>
<button class="bg-surface-container text-secondary opacity-50 cursor-not-allowed rounded-lg py-3 flex justify-center items-center font-body-md text-body-md line-through" disabled="">
                        02:30
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        03:00
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        03:30
                    </button>
</div>
</div>
<!-- Evening Section -->
<div>
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-secondary text-[18px]">bedtime</span>
<h3 class="font-label-md text-label-md text-secondary uppercase tracking-widest">Evening</h3>
</div>
<div class="grid grid-cols-3 gap-3">
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        04:00
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        04:30
                    </button>
<button class="border border-outline-variant bg-surface rounded-lg py-3 flex justify-center items-center font-body-md text-body-md text-on-surface hover:border-primary hover:text-primary transition-colors">
                        05:00
                    </button>
</div>
</div>
</section>
</main>
<!-- Sticky Footer CTA -->
<div class="fixed bottom-[64px] left-0 w-full p-4 bg-surface/95 backdrop-blur-sm border-t border-outline-variant z-40">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-3 rounded-full hover:bg-on-primary-fixed-variant transition-colors active:scale-[0.98]">
            Next
        </button>
</div>
<!-- BottomNavBar (Shared Component) -->
<nav class="fixed bottom-0 left-0 w-full z-50 lg:hidden flex justify-around items-center px-4 py-2 bg-surface shadow-md border-t border-outline-variant rounded-t-full">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-container active:bg-surface-container-high transition-colors p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Book (Active - Semantic Match for booking flow) -->
<a class="flex flex-col items-center justify-center text-primary font-bold scale-90 duration-150 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined icon-fill mb-1">add_circle</span>
<span class="font-label-md text-label-md">Book</span>
</a>
<!-- My Visits (Inactive) -->
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-container active:bg-surface-container-high transition-colors p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">history</span>
<span class="font-label-md text-label-md">My Visits</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-secondary hover:text-primary-container active:bg-surface-container-high transition-colors p-2 rounded-xl" href="#">
<span class="material-symbols-outlined mb-1">person</span>
<span class="font-label-md text-label-md">Profile</span>
