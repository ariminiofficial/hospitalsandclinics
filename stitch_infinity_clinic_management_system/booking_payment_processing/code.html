<style>
        .spinner {
            animation: rotate 2s linear infinite;
        }
        .spinner .path {
            stroke: #0052cc;
            stroke-linecap: round;
            animation: dash 1.5s ease-in-out infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
        @keyframes dash {
            0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
            50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
            100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
        }
        .pulse-bg {
            animation: pulse-bg-anim 3s infinite ease-in-out;
        }
        @keyframes pulse-bg-anim {
            0%, 100% { background-color: #f1f3ff; } /* surface-container-low */
            50% { background-color: #e8edff; } /* surface-container */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-md md:p-margin antialiased">
<!-- Main Content Canvas -->
<main class="w-full max-w-[400px] flex flex-col items-center text-center space-y-xl z-10">
<!-- Brand / Identity (Optional, subtle presence) -->
<div class="mb-gutter">
<h1 class="font-headline-sm text-headline-sm text-primary">Infinity Clinic</h1>
</div>
<!-- Animated Progress Indicator Area -->
<div class="relative w-32 h-32 flex items-center justify-center pulse-bg rounded-full shadow-[0_8px_24px_rgba(9,30,66,0.12)]">
<!-- SVG Spinner -->
<svg class="spinner w-16 h-16" viewBox="0 0 50 50">
<circle class="path" cx="25" cy="25" fill="none" r="20" stroke-width="5"></circle>
</svg>
</div>
<!-- Status Text -->
<div class="space-y-sm px-md">
<h2 class="font-headline-md text-headline-md text-on-surface">Processing Payment...</h2>
<p class="font-body-md text-body-md text-secondary">
                Please do not close the window or refresh the page.
            </p>
</div>
<!-- Security Badge -->
<div class="mt-xxl flex items-center space-x-sm px-lg py-sm bg-surface-container-high rounded-full border border-outline-variant/30">
<span class="material-symbols-outlined text-primary-container" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">100% Secure Payment</span>
</div>
</main>
<!-- Decorative background elements to reduce anxiety (ambient, non-distracting) -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-surface-dim rounded-full blur-[100px] opacity-40"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-surface-container rounded-full blur-[120px] opacity-50"></div>
</div>
</body></html>
