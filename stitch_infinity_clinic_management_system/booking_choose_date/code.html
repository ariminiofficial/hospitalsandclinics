</button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const dateButtons = document.querySelectorAll('.selectable');
            const nextBtn = document.getElementById('nextBtn');
            
            dateButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Reset all
                    dateButtons.forEach(b => {
                        b.classList.remove('bg-primary-container', 'text-on-primary-container');
                        b.classList.add('text-on-surface');
                    });
                    
                    // Set active
                    btn.classList.add('bg-primary-container', 'text-on-primary-container');
                    btn.classList.remove('text-on-surface');
                    
                    // Enable Next button
                    nextBtn.classList.remove('opacity-50', 'pointer-events-none');
                    nextBtn.classList.add('hover:bg-primary', 'shadow-md');
                });
            });
        });
    </script>
