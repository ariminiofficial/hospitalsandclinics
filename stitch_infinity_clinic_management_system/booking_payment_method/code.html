<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface font-body-md text-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container flex flex-col min-h-screen">
<!-- Top App Bar Contextual -->
<header class="fixed top-0 left-0 w-full h-16 flex items-center px-md bg-surface border-b border-outline-variant z-40">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-container-high transition-colors text-on-surface flex items-center justify-center active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="ml-sm font-headline-sm text-headline-sm text-on-surface font-extrabold tracking-tight">Payment Method</h1>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[88px] px-md pb-[180px] max-w-lg mx-auto w-full">
<!-- Summary Section -->
<section class="mb-lg">
<h2 class="font-label-md text-label-md text-secondary uppercase mb-sm tracking-wider">Appointment Summary</h2>
<div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md">
<div class="flex items-center gap-md pb-md mb-md border-b border-outline-variant">
<img class="w-12 h-12 rounded-full object-cover border border-surface-container" data-alt="A professional headshot of a female doctor in a pristine, modern clinical setting. She wears a clean white coat over a light blue shirt, exuding warmth and reliability. The lighting is high-key and soft, illuminating her friendly smile. The background is slightly blurred, showing medical equipment in a light-mode aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCQcJPLezpPClAbDegzbZ-tJ8WghgKKHHbPiREeeKO1-7AStM4gnIGy-8j2t61qvS1iZ9upu_OFcyZFDqmEsXsi7_d2AV9c0jUOa1Vsx9AN2bUDSVhX65qAKa6WzsDNag2QokNa0nTZb3Lt6SW5rOhcrHTXldU1rGGc4fUZ6Jm0ndm_NtW2gKzK2w7lYvkKlRFEl946zJqfH-QaWH97ERwTu7vUSH8CVWlvBqsKoO1k8BwqHKKLUn7-bw">
<div>
<p class="font-body-md text-body-md font-bold text-on-surface">Dr. Sarah Jenkins</p>
<p class="font-body-sm text-body-sm text-secondary">Senior Cardiologist</p>
</div>
</div>
<div class="flex flex-col gap-sm">
<div class="flex justify-between items-center">
<span class="font-body-sm text-body-sm text-secondary flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">calendar_month</span> Date &amp; Time
                        </span>
<span class="font-body-sm text-body-sm text-on-surface font-medium">Oct 24, 10:00 AM</span>
</div>
<div class="flex justify-between items-center mt-xs pt-xs border-t border-surface-container">
<span class="font-body-sm text-body-sm text-secondary flex items-center gap-xs">
<span class="material-symbols-outlined text-[18px]">payments</span> Consultation Fee
                        </span>
<span class="font-body-md text-body-md text-primary font-bold">$150.00</span>
</div>
</div>
</div>
</section>
<!-- Payment Options Section -->
<section>
<h2 class="font-label-md text-label-md text-secondary uppercase mb-sm tracking-wider">Select Method</h2>
<div class="flex flex-col gap-sm">
<!-- UPI Option -->
<label class="group relative flex items-center justify-between p-md bg-surface-container-lowest border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-inverse-on-surface">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-has-[:checked]:bg-primary group-has-[:checked]:text-on-primary transition-colors">
<span class="material-symbols-outlined">qr_code_scanner</span>
</div>
<div>
<span class="block font-body-md text-body-md font-medium text-on-surface">UPI</span>
<span class="block font-body-sm text-body-sm text-secondary">GPay, PhonePe, Paytm</span>
</div>
</div>
<input checked="" class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-surface-container-lowest" name="payment_method" type="radio" value="upi">
</label>
<!-- Card Option -->
<label class="group relative flex items-center justify-between p-md bg-surface-container-lowest border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-inverse-on-surface">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-has-[:checked]:bg-primary group-has-[:checked]:text-on-primary transition-colors">
<span class="material-symbols-outlined">credit_card</span>
</div>
<div>
<span class="block font-body-md text-body-md font-medium text-on-surface">Credit / Debit Card</span>
<span class="block font-body-sm text-body-sm text-secondary">Visa, MasterCard, Amex</span>
</div>
</div>
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-surface-container-lowest" name="payment_method" type="radio" value="card">
</label>
<!-- Net Banking Option -->
<label class="group relative flex items-center justify-between p-md bg-surface-container-lowest border border-outline-variant rounded-xl cursor-pointer hover:bg-surface-container-low transition-colors has-[:checked]:border-primary has-[:checked]:bg-inverse-on-surface">
<div class="flex items-center gap-md">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-primary group-has-[:checked]:bg-primary group-has-[:checked]:text-on-primary transition-colors">
<span class="material-symbols-outlined">account_balance</span>
</div>
<div>
<span class="block font-body-md text-body-md font-medium text-on-surface">Net Banking</span>
<span class="block font-body-sm text-body-sm text-secondary">All major banks supported</span>
</div>
</div>
<input class="w-5 h-5 text-primary border-outline focus:ring-primary focus:ring-offset-surface-container-lowest" name="payment_method" type="radio" value="netbanking">
</label>
</div>
</section>
</main>
<!-- Fixed Payment Action Bar (Above Nav) -->
<div class="fixed bottom-[80px] left-0 w-full p-md bg-surface bg-opacity-95 backdrop-blur-sm border-t border-outline-variant z-40">
<button class="w-full bg-primary text-on-primary font-body-md text-body-md font-bold py-md rounded-xl flex justify-between items-center px-lg active:scale-[0.98] transition-transform shadow-sm">
<span>Pay Now</span>
<span>$150.00</span>
</button>
<div class="flex justify-center items-center gap-xs mt-sm text-secondary">
<span class="material-symbols-outlined text-[16px]">shield_lock</span>
<span class="font-label-md text-label-md">Secure 256-bit Encryption</span>
</div>
</div>
<!-- BottomNavBar Component -->
<nav class="fixed bottom-0 left-0 w-full z-50 lg:hidden flex justify-around items-center px-4 py-2 bg-surface border-t border-outline-variant shadow-md h-[80px] docked full-width rounded-t-full">
<!-- Home -->
<a class="flex flex-col items-center justify-center text-secondary active:bg-surface-container-high p-2 rounded-xl transition-colors scale-100 hover:text-primary-container" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-md text-label-md mt-1">Home</span>
</a>
<!-- Book (Active State based on Intent) -->
<a class="flex flex-col items-center justify-center text-primary scale-90 duration-150 p-2 rounded-xl" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-md text-label-md mt-1">Book</span>
</a>
<!-- My Visits -->
<a class="flex flex-col items-center justify-center text-secondary active:bg-surface-container-high p-2 rounded-xl transition-colors scale-100 hover:text-primary-container" href="#">
<span class="material-symbols-outlined">history</span>
<span class="font-label-md text-label-md mt-1">My Visits</span>
</a>
<!-- Profile -->
<a class="flex flex-col items-center justify-center text-secondary active:bg-surface-container-high p-2 rounded-xl transition-colors scale-100 hover:text-primary-container" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-label-md text-label-md mt-1">Profile</span>
</a>
</nav>
</body></html>
